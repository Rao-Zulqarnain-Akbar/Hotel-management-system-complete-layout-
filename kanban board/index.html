<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kanban Board</title>

    <link href="dist/output.css" rel="stylesheet">

</head>

<body class="bg-gray-100 min-h-screen">

    <div class="max-w-6xl mx-auto p-4 sm:p-6">

        <h1 class="text-3xl sm:text-4xl font-bold text-purple-600 text-center mb-6">
            Kanban Board
        </h1>


        <div class="flex flex-col sm:flex-row gap-3 mb-6">

            <input type="text" id="taskInput" placeholder="Enter task" class="flex-1 p-3 border rounded-lg outline-none">

            <button id="addBtn" class="bg-purple-600 text-white px-6 py-3 rounded-lg hover:bg-purple-700">
                Add Task
            </button>

        </div>


        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-5">

    
            <div id="todo" class="bg-gray-200 rounded-xl p-4 min-h-80">
                <h2 class="text-xl font-bold mb-4">
                    To Do
                </h2>
            </div>


            <div id="progress" class="bg-blue-100 rounded-xl p-4 min-h-80">
                <h2 class="text-xl font-bold mb-4">
                    In Progress
                </h2>
            </div>

            <div id="done" class="bg-green-100 rounded-xl p-4 min-h-80">
                <h2 class="text-xl font-bold mb-4">
                    Done
                </h2>
            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
