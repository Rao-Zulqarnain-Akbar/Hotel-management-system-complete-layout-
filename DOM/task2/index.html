<body>
    <p id="para">this is a para but not a short or unchanged</p>
    <p id="para">this is another para</p>
    <p id="para">this is third para</p>
    <p id="para">this is forth para</p>

    <button onclick="changepara()">Change Para</button>
    <script>
      function changepara() {
        let paras = document.querySelectorAll("#para")

            para.innerText= "This is a new para and it is large one and this is changed and having length approx double";  
        })
      } 
    </script>
